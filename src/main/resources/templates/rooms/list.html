<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Rum</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            GuestHouse
        </a>

        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">
                Startsida
            </a>

            <a class="nav-link" th:href="@{/customers}">
                Kunder
            </a>

            <a class="nav-link active" th:href="@{/rooms}">
                Rum
            </a>

            <a class="nav-link" th:href="@{/bookings}">
                Bokningar
            </a>
        </div>

    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-4">Rum</h1>

    <div class="card p-4 mb-4">

        <h3>Lägg till rum</h3>

        <form th:action="@{/rooms/save}"
              th:object="${room}"
              method="post">

            <div class="mb-3">
                <label>Rumsnummer</label>

                <input type="number"
                       class="form-control"
                       th:field="*{roomNumber}"
                       required>
            </div>

            <div class="mb-3">
                <label>Rumstyp</label>

                <select class="form-control"
                        th:field="*{roomType}">

                    <option value="SINGLE">
                        Enkelrum
                    </option>

                    <option value="DOUBLE">
                        Dubbelrum
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label>Extrasängar</label>

                <select class="form-control"
                        th:field="*{extraBeds}">

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>

                </select>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Spara rum
            </button>

        </form>

    </div>

    <div class="card p-4">

        <h3 class="mb-3">Alla rum</h3>

        <table class="table table-bordered">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Rumsnummer</th>
                <th>Typ</th>
                <th>Extrasängar</th>
                <th>Åtgärd</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="r : ${rooms}">

                <td th:text="${r.id}"></td>

                <td th:text="${r.roomNumber}"></td>

                <td th:text="${r.roomType}"></td>

                <td th:text="${r.extraBeds}"></td>

                <td>

                    <a th:href="@{/rooms/delete/{id}(id=${r.id})}"
                       class="btn btn-sm btn-danger">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
