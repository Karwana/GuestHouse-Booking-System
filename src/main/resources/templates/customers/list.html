<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Kunder</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            GuestHouse
        </a>

        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">
                Startsida
            </a>

            <a class="nav-link active" th:href="@{/customers}">
                Kunder
            </a>

            <a class="nav-link" th:href="@{/rooms}">
                Rum
            </a>

            <a class="nav-link" th:href="@{/bookings}">
                Bokningar
            </a>
        </div>

    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-4">Kunder</h1>

    <div class="card p-4 mb-4">

        <h3>Lägg till kund</h3>

        <form th:action="@{/customers/save}"
              th:object="${customer}"
              method="post">

            <div class="mb-3">
                <label>Namn</label>

                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       required>
            </div>

            <div class="mb-3">
                <label>Email</label>

                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       required>
            </div>

            <div class="mb-3">
                <label>Telefonnummer</label>

                <input type="text"
                       class="form-control"
                       th:field="*{phoneNumber}"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Spara kund
            </button>

        </form>

    </div>

    <div class="card p-4">

        <h3 class="mb-3">Alla kunder</h3>

        <table class="table table-bordered">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Namn</th>
                <th>Email</th>
                <th>Telefonnummer</th>
                <th>Hantera</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="c : ${customers}">

                <td th:text="${c.id}"></td>

                <td th:text="${c.name}"></td>

                <td th:text="${c.email}"></td>

                <td th:text="${c.phoneNumber}"></td>

                <td>

                    <a th:href="@{/customers/edit/{id}(id=${c.id})}"
                       class="btn btn-sm btn-primary">
                        Edit
                    </a>

                    <a th:href="@{/customers/delete/{id}(id=${c.id})}"
                       class="btn btn-sm btn-danger">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
