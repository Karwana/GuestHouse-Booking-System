<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Bokningar</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">Bokningar</h1>

    <div class="mb-3">
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Startsida</a>
        <a th:href="@{/customers}" class="btn btn-secondary btn-sm">Kunder</a>
        <a th:href="@{/rooms}" class="btn btn-secondary btn-sm">Rum</a>
    </div>


    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>


    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <div class="row">


        <div class="col-md-4">

            <h3 th:if="${editMode} == false">Ny bokning</h3>
            <h3 th:if="${editMode} == true">Redigera bokning</h3>


            <form th:if="${editMode} == false"
                  th:action="@{/bookings/save}"
                  th:object="${booking}"
                  method="post">

                <div class="mb-3">
                    <label>Kund</label>

                    <select class="form-control"
                            th:field="*{customer.id}">

                        <option value="">Välj kund</option>

                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Rum</label>

                    <select class="form-control"
                            th:field="*{room.id}">

                        <option value="">Välj rum</option>

                        <option th:each="r : ${rooms}"
                                th:value="${r.id}"
                                th:text="'Rum ' + ${r.roomNumber}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Startdatum</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{startDate}">
                </div>

                <div class="mb-3">
                    <label>Slutdatum</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{endDate}">
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Spara
                </button>

            </form>

            <form th:if="${editMode} == true"
                  th:action="@{/bookings/update/{id}(id=${booking.id})}"
                  th:object="${booking}"
                  method="post">

                <div class="mb-3">
                    <label>Kund</label>

                    <select class="form-control"
                            th:field="*{customer.id}">

                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Rum</label>

                    <select class="form-control"
                            th:field="*{room.id}">

                        <option th:each="r : ${rooms}"
                                th:value="${r.id}"
                                th:text="'Rum ' + ${r.roomNumber}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Startdatum</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{startDate}">
                </div>

                <div class="mb-3">
                    <label>Slutdatum</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{endDate}">
                </div>

                <button type="submit"
                        class="btn btn-warning">
                    Uppdatera
                </button>

                <a th:href="@{/bookings}"
                   class="btn btn-secondary">
                    Avbryt
                </a>

            </form>

        </div>


        <div class="col-md-8">

            <h3>Alla bokningar</h3>

            <table class="table table-bordered">

                <thead>
                <tr>
                    <th>Kund</th>
                    <th>Rum</th>
                    <th>Start</th>
                    <th>Slut</th>
                    <th>Åtgärder</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="b : ${bookings}">

                    <td th:text="${b.customer.name}"></td>

                    <td th:text="${b.room.roomNumber}"></td>

                    <td th:text="${b.startDate}"></td>

                    <td th:text="${b.endDate}"></td>

                    <td>

                        <a th:href="@{/bookings/edit/{id}(id=${b.id})}"
                           class="btn btn-sm btn-primary">
                            Edit
                        </a>

                        <a th:href="@{/bookings/delete/{id}(id=${b.id})}"
                           class="btn btn-sm btn-danger">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
