<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Recensioner</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">GuestHouse</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Startsida</a>
            <a class="nav-link" th:href="@{/customers}">Kunder</a>
            <a class="nav-link" th:href="@{/rooms}">Rum</a>
            <a class="nav-link" th:href="@{/bookings}">Bokningar</a>
            <a class="nav-link active" th:href="@{/reviews}">Recensioner</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-4">Recensioner</h1>

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="row">

        <div class="col-md-4">

            <div class="card p-4 shadow-sm mb-4">
                <h5>Välj rum</h5>
                <p class="text-muted small">
                    Välj ett rum för att läsa eller lämna recensioner.
                </p>
                <form method="get">
                    <div class="mb-3">
                        <select class="form-control"
                                name="roomId"
                                id="roomSelect"
                                onchange="goToRoom()">
                            <option value="">Välj rum i listan...</option>
                            <option th:each="r : ${rooms}"
                                    th:value="${r.id}"
                                    th:text="'Rum ' + ${r.roomNumber}"
                                    th:selected="${r.id == selectedRoomId}">
                            </option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="card p-4 shadow-sm"
                 th:if="${selectedRoomId != null}">
                <h5>Ny recension för valt rum</h5>
                <p class="text-muted small">
                    Kunden måste ha bokat rummet för att
                    kunna lämna recension.
                </p>
                <form th:action="@{/reviews/save}"
                      th:object="${review}"
                      method="post">

                    <input type="hidden"
                           th:value="${selectedRoomId}"
                           name="roomId">

                    <div class="mb-3">
                        <label class="form-label">Kund</label>
                        <select class="form-control"
                                th:field="*{customerId}"
                                required>
                            <option value="">Välj kund</option>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Betyg (1-5)
                        </label>
                        <select class="form-control"
                                th:field="*{rating}"
                                required>
                            <option value="">Välj betyg</option>
                            <option value="1">1 ⭐</option>
                            <option value="2">2 ⭐⭐</option>
                            <option value="3">3 ⭐⭐⭐</option>
                            <option value="4">4 ⭐⭐⭐⭐</option>
                            <option value="5">5 ⭐⭐⭐⭐⭐</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kommentar</label>
                        <textarea class="form-control"
                                  th:field="*{comment}"
                                  rows="3"
                                  required></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Spara recension
                    </button>
                </form>
            </div>

        </div>

        <div class="col-md-8">
            <div class="card p-4 shadow-sm">

                <h5 class="mb-3"
                    th:text="${selectedRoomId != null}
                    ? 'Befintliga recensioner för valt rum'
                    : 'Välj ett rum till vänster för att se recensioner'">
                </h5>

                <div th:if="${reviews == null or reviews.isEmpty()
                              and selectedRoomId != null}"
                     class="alert alert-info">
                    Inga recensioner för detta rum ännu.
                </div>

                <div th:unless="${reviews == null or reviews.isEmpty()}">
                    <div th:each="r : ${reviews}"
                         class="card mb-3 border-0 bg-light">
                        <div class="card-body">
                            <div class="d-flex justify-content-between
                                        align-items-start">
                                <div>
                                    <span class="fw-bold"
                                          th:text="${r.customerName}">
                                    </span>
                                    <span class="ms-3 text-warning">
                                        <span th:each="i : ${#numbers.sequence(1, r.rating)}">⭐</span>
                                    </span>
                                </div>
                                <a th:href="@{/reviews/delete/{id}(id=${r.id}, roomId=${selectedRoomId})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Ta bort recension?')">
                                    Ta bort
                                </a>
                            </div>
                            <p class="mt-2 mb-0"
                               th:text="${r.comment}">
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function goToRoom() {
        var roomId = document.getElementById('roomSelect').value;
        if (roomId) {
            window.location.href = '/reviews/room/' + roomId;
        }
    }
</script>

</body>
</html>
