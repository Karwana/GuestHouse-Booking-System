name: Production Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (leave empty for newest master). Use an older SHA to roll back."
        required: false
        default: ""

jobs:
  deploy-production:
    name: Deploy to Railway production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy image to production
        env:
          TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_PROD_ENV_ID }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          TARGET_SHA="${INPUT_SHA:-$DEFAULT_SHA}"
          IMAGE="${DOCKER_USERNAME}/booking-system:${TARGET_SHA}"
          echo "Deploying $IMAGE to production"
          post() {
            curl -sS https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d "$1" | tee out.json
            echo
            ! grep -q '"errors"' out.json
          }
          post "$(jq -n --arg s "$SERVICE_ID" --arg e "$ENV_ID" --arg i "$IMAGE" '{query:"mutation($s:String!,$e:String!,$i:String!){serviceInstanceUpdate(serviceId:$s,environmentId:$e,input:{source:{image:$i}})}",variables:{s:$s,e:$e,i:$i}}')"
          post "$(jq -n --arg s "$SERVICE_ID" --arg e "$ENV_ID" '{query:"mutation($s:String!,$e:String!){serviceInstanceDeployV2(serviceId:$s,environmentId:$e)}",variables:{s:$s,e:$e}}')"
