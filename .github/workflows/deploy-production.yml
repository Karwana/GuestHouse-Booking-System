name: Production Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Git Commit SHA att driftsätta (lämna tomt för senaste master)"
        required: false
        default: ""

jobs:
  deploy-production:
    name: Trigger Railway Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Image to Production
        run: |
          TARGET_SHA="${{ github.event.inputs.commit_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "Driftsätter version med commit SHA: $TARGET_SHA till produktion..."

          curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation ServiceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",
              "variables": {
                "environmentId": "${{ secrets.RAILWAY_PROD_ENV_ID }}",
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}"
              }
            }'
